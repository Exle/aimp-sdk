name: Update AIMP SDK

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions:
  contents: write

concurrency:
  group: update-sdk
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    outputs:
      stable_update: ${{ steps.check.outputs.stable_update }}
      beta_update: ${{ steps.check.outputs.beta_update }}

      stable_url: ${{ steps.metadata.outputs.stable_url }}
      stable_version: ${{ steps.metadata.outputs.stable_version }}
      stable_date: ${{ steps.metadata.outputs.stable_date }}
      stable_tag: ${{ steps.metadata.outputs.stable_tag }}
      stable_md5: ${{ steps.metadata.outputs.stable_md5 }}
      stable_sha256: ${{ steps.metadata.outputs.stable_sha256 }}

      beta_url: ${{ steps.metadata.outputs.beta_url }}
      beta_version: ${{ steps.metadata.outputs.beta_version }}
      beta_date: ${{ steps.metadata.outputs.beta_date }}
      beta_tag: ${{ steps.metadata.outputs.beta_tag }}
      beta_md5: ${{ steps.metadata.outputs.beta_md5 }}
      beta_sha256: ${{ steps.metadata.outputs.beta_sha256 }}

    steps:
      - name: Read SDK metadata
        id: metadata
        env:
          SDK_PAGE_URL: ${{ vars.AIMP_SDK_URL }}
        run: |
          : "${SDK_PAGE_URL:?vars.AIMP_SDK_URL is not set}"

          parse_block() {
            local block="$1"
            local channel url version md5 sha256 tag

            if grep -qi "beta" <<<"$block"; then
              channel="beta"
            else
              channel="stable"
            fi

            url=$(grep -m1 -oP 'class="button link_full"[^>]*href="\K[^"]+' <<<"$block" || true)
            : "${url:?Failed to parse download URL}"
            url=$(sed 's/&amp;/\&/g;s|^/|https://aimp.ru/|' <<<"$url")

            version=$(grep -oP '^.*</a>\K.*?(?=<h3)' <<<"$block" | xargs || true)
            : "${version:?Failed to parse version}"

            md5=$(grep -m1 -oP '<nobr>MD5:\s*\K[a-f0-9]{32}' <<<"$block" || true)
            : "${md5:?Failed to parse MD5}"

            sha256=$(grep -m1 -oP '<nobr>SHA256:\s*\K[a-f0-9]{64}' <<<"$block" || true)
            : "${sha256:?Failed to parse SHA256}"

            tag="${channel}-${version// /-}-${sha256:0:12}"

            {
              echo "${channel}_url=$url"
              echo "${channel}_version=$version"
              echo "${channel}_md5=$md5"
              echo "${channel}_sha256=$sha256"
              echo "${channel}_tag=$tag"
            } >> "$GITHUB_OUTPUT"

            FOUND[$channel]=1
          }

          declare -A FOUND

          html=$(curl -fsSL --retry 3 --retry-delay 5 --max-time 60 "$SDK_PAGE_URL")

          mapfile -t blocks < <(
            tr -d '\n' <<<"$html" |
            grep -oP '<li class="link">.*?</li>'
          )

          (( ${#blocks[@]} > 0 )) || {
            echo "::error::No SDK entries found"
            exit 1
          }

          for block in "${blocks[@]}"; do
            parse_block "$block"
          done

          [[ -n "${FOUND[stable]-}" && -n "${FOUND[beta]-}" ]] || {
            echo "::error::Stable or beta SDK entry not found"
            exit 1
          }

          date=$(grep -m1 -oP 'Release date:\s*\K[0-9.]+' <<<"$html" || true)
          : "${date:?Failed to parse release date}"

          {
            echo "stable_date=$date"
            echo "beta_date=$date"
          } >> "$GITHUB_OUTPUT"

      - name: Check existing releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ steps.metadata.outputs.stable_tag }}
          BETA_TAG: ${{ steps.metadata.outputs.beta_tag }}
        run: |
          check_channel() {
            local tag="$1"
            local output="$2"

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$output=false" >> "$GITHUB_OUTPUT"
            else
              echo "$output=true" >> "$GITHUB_OUTPUT"
            fi
          }

          check_channel "$STABLE_TAG" stable_update
          check_channel "$BETA_TAG" beta_update

  update-stable:
    needs: check
    if: needs.check.outputs.stable_update == 'true'
    uses: ./.github/workflows/update-channel.yml
    with:
      channel: stable
      branch: main
      sdk_url: ${{ needs.check.outputs.stable_url }}
      sdk_version: ${{ needs.check.outputs.stable_version }}
      sdk_date: ${{ needs.check.outputs.stable_date }}
      sdk_tag: ${{ needs.check.outputs.stable_tag }}
      expected_md5: ${{ needs.check.outputs.stable_md5 }}
      expected_sha256: ${{ needs.check.outputs.stable_sha256 }}

  update-beta:
    needs: check
    if: needs.check.outputs.beta_update == 'true'
    uses: ./.github/workflows/update-channel.yml
    with:
      channel: beta
      branch: beta
      sdk_url: ${{ needs.check.outputs.beta_url }}
      sdk_version: ${{ needs.check.outputs.beta_version }}
      sdk_date: ${{ needs.check.outputs.beta_date }}
      sdk_tag: ${{ needs.check.outputs.beta_tag }}
      expected_md5: ${{ needs.check.outputs.beta_md5 }}
      expected_sha256: ${{ needs.check.outputs.beta_sha256 }}